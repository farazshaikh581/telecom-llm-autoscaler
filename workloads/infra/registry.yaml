# In-cluster image registry for our own images (SeBS functions).
# Runs on the control node. Nodes pull from localhost:32000 (NodePort), which
# microk8s containerd trusts by default. Images never leave the cluster.
apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: microk8s-hostpath
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      nodeSelector: {node.kubernetes.io/microk8s-controlplane: microk8s-controlplane}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
      - name: registry
        image: registry:2.8.3
        ports: [{containerPort: 5000}]
        env: [{name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}]
        volumeMounts: [{name: data, mountPath: /var/lib/registry}]
        readinessProbe: {httpGet: {path: /v2/, port: 5000}, periodSeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: registry-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry}
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000, nodePort: 32000}]
